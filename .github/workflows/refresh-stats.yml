name: Refresh stats

# Pulls the forum index, download counts and discussion activity once a day,
# commits the result, and asks Vercel to rebuild. This is what lets a fully
# static site show live-ish data without a database or a runtime API call.
#
# It is also why the deployment needs no GitHub credential of its own. The token
# below is injected by Actions, scoped to this repository and rotated every run.
# A Personal Access Token on the build host would work too — until it expired,
# at which point the forum would quietly stop updating with nobody watching.
#
# VERCEL_DEPLOY_HOOK is optional: pushing to main already triggers a Vercel
# build through the GitHub integration. The hook only matters if the repo is
# later deployed somewhere that does not watch pushes.

on:
  schedule:
    # Hourly, not daily. The browse grid reads vote and download counts from the
    # committed stats file, so the gap between someone voting and the number
    # changing on a card is however long this interval is. A day made voting
    # feel broken; an hour is short enough to read as "it updated".
    #
    # It only commits when something actually changed, so a quiet hour costs a
    # few API calls and nothing else. Actions minutes are free on public repos.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Collect forum index and stats
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: npx tsx scripts/refresh-stats.ts

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- lib/stats.generated.json lib/discussions.generated.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing changed; skipping commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/stats.generated.json lib/discussions.generated.json
          git commit -m "chore: refresh forum index and listing stats"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger rebuild
        if: steps.commit.outputs.changed == 'true' && vars.VERCEL_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "${{ vars.VERCEL_DEPLOY_HOOK }}"
